<!DOCTYPE html>
<html lang="en">

<head>
	<title>Personality Quiz Starter Code</title>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- import the webpage's stylesheet -->
	<link rel="stylesheet" href="style.css">
   
	<!-- import the webpage's javascript file -->
	<script src="script.js" defer>

	</script>
</head>

<body>

	<header>
		<h1>Are you more like a bunny or a gecko?</h1>
	</header>

	<main>

		<h2>Are you a morning dove or a night owl?</h2>
		<div class="question">

			<div class="answer-choice">
				<img src="assets/day.jpg" alt="A photo of grassy field with hills behind it">
        <br>
        <button id="q1a1">Definitely a morning dove!</button>
      </div>

      <div class="answer-choice">
        <img src="assets/night.jpg" alt="A photo of the night sky with dozen of stars. There are silhouettes of trees below">
        <br>
        <button id="q1a2">Definitely a night owl!</button>
      </div>

    </div> 
    
    <h2>Are you more energetic or laid-back?</h2>
      <div class="question">

      <div class="answer-choice">
        <img src="assets/energy.jpg" alt="A photo of a woman on the beach, up in the air with one leg under her and the other beside her hand">
        <br>
        <button id="q2a1">Energetic!</button>
      </div>

      <div class="answer-choice">
        <img src="assets/alone.jpg" alt="A dimly lit photo of a man lying back against his window pane who is looking over to a city,">
        <br>
        <button id="q2a2">More laid-back</button>
      </div>

    </div> 
    
    <h2>Are you more chatty or more private?</h2>
    <div class="question">

      <div class="answer-choice">
        <img src="assets/lonewolf.jpg" alt="A low-quality, deep-fried image of an anthro werewolf sitting in a dark forest, looking into the distance.">
        <br>
        <button id="q3a1">What can I say? I'm a lone wolf...</button>
      </div>

      <div class="answer-choice">
        <img src="assets/boy.jpg" alt="A photo of a boy with a deadpan expression wearing a hat, holding a green corded telephone.">
        <br>
        <button id="q3a2">I love to talk!</button>
      </div>
    </div> 
    
    <h2 id="result">Your result is...</h2>

      <p>Images from <a href = https://pixabay.com>Pixabay!</a> ... except the Wolf one. That's from Google. </p>
    <button id="Restart">Restart
</button>
    
  </main>
    </body>
</html>
